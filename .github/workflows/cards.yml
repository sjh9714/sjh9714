# 기여 통계 카드를 SVG 로 만들어 커밋하고, 블로그 최근 글을 README 에 써넣는다.
# 커밋 주체는 github-actions[bot] — 사람 커밋으로 위장하면 잔디가 거짓말이 된다.
name: cards

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cards.yml"]

# 같은 워크플로가 두 번 겹쳐 돌면 나중 것의 git push 가 거부된다. 실제로 겪었다.
concurrency:
  group: cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 티스토리는 Accept 가 application/rss+xml 이면 406 을 준다. UA 는 무관하고
      # 이 헤더만 문제다. keepalive 의 더미 커밋도 끄고, 커밋은 아래에서 한다.
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://sjh9714.tistory.com/rss"
          max_post_count: 5
          template: "$newline- [$title]($url)"
          accept_header: "*/*"
          skip_commit: true
          enable_keepalive: false

      # THEME 을 비우면 65개 테마를 전부 만든다. README 는 두 개만 쓰므로 하나씩
      # 지정해 두 번 돌린다. 두 번째 실행이 출력 폴더를 통째로 비우므로 사이에
      # default 를 빼뒀다가 되돌린다. 커밋은 마지막에 한 번만 한다.
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 9
          THEME: default
          AUTO_PUSH: false
          EXCLUDE_REPOS: sjh9714/sjh9714

      - run: cp -r profile-summary-card-output/default "$RUNNER_TEMP/default-theme"

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 9
          THEME: github_dark
          AUTO_PUSH: false
          EXCLUDE_REPOS: sjh9714/sjh9714

      - name: 쓰는 것만 남긴다
        run: |
          mkdir -p profile-summary-card-output/default
          cp -r "$RUNNER_TEMP/default-theme/." profile-summary-card-output/default/
          find profile-summary-card-output -mindepth 1 -maxdepth 1 -type d \
            ! -name default ! -name github_dark -exec rm -rf {} +
          find profile-summary-card-output -type f ! -name '3-stats.svg' -delete
          find profile-summary-card-output -type d -empty -delete

      - name: 바뀐 게 있으면 커밋한다
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 블로그 최근 글을 갱신한다"
          git push
