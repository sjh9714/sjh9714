# 통계 카드를 SVG 로 만들어 리포에 커밋하고, 블로그 최근 글을 README 에 써넣는다.
#
# 왜 호스팅 위젯을 안 쓰나 — 2026-08 기준 github-readme-stats 공식 인스턴스는 503,
# github-profile-trophy 는 402(할당량 초과)다. 남의 Vercel 무료 할당량에 프로필이
# 매달려 있으면 어느 날 조용히 깨진다. 여기서 만들어 커밋하면 안 깨진다.
#
# 커밋 주체는 github-actions[bot] — 사람 커밋으로 위장하면 잔디가 거짓말이 된다.
name: cards

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cards.yml"]

# 같은 워크플로가 두 번 겹쳐 돌면 나중 것의 git push 가 거부된다. 실제로 겪었다.
concurrency:
  group: cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 티스토리는 Accept 가 application/rss+xml 이면 406 을 준다. UA 는 무관하고
      # 이 헤더만 문제라서 */* 로 바꾼다. 커밋은 아래에서 한꺼번에 한다.
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://sjh9714.tistory.com/rss"
          max_post_count: 5
          template: "$newline- [$title]($url)"
          accept_header: "*/*"
          skip_commit: true
          # 이 액션은 skip_commit 이어도 내부에서 git pull --rebase 를 돈다.
          # 앞 단계가 남긴 변경이 있으면 거부되므로 카드 생성보다 먼저 두고,
          # keepalive 의 더미 커밋도 끈다.
          enable_keepalive: false

      # THEME 을 비우면 65개 테마를 전부 만든다(325장, 2.6MB). README 는 두 개만
      # 쓰므로 하나씩 지정해 두 번 돌린다. AUTO_PUSH 는 꺼두고 마지막에 한 번만
      # 커밋한다 — 한 브랜치에 여러 번 push 하면 서로 부딪힌다.
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 9
          THEME: default
          AUTO_PUSH: false
          # 프로필 리포 자신은 언어 통계에서 뺀다. 워크플로가 만든 SVG 때문에
          # 쓰지도 않는 언어가 상위로 올라온다.
          EXCLUDE_REPOS: sjh9714/sjh9714

      # 이 액션은 실행할 때 출력 폴더를 통째로 비운다. 두 번째 실행이 첫 번째가
      # 만든 default 를 지워버려서, 사이에 빼뒀다가 끝나고 되돌린다.
      - run: cp -r profile-summary-card-output/default "$RUNNER_TEMP/default-theme"

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 9
          THEME: github_dark
          AUTO_PUSH: false
          EXCLUDE_REPOS: sjh9714/sjh9714

      - run: |
          mkdir -p profile-summary-card-output/default
          cp -r "$RUNNER_TEMP/default-theme/." profile-summary-card-output/default/

      - name: 쓰지 않는 테마를 지우고 한 번에 커밋한다
        run: |
          find profile-summary-card-output -mindepth 1 -maxdepth 1 -type d \
            ! -name default ! -name github_dark -exec rm -rf {} +
          git add -A
          if git diff --cached --quiet; then
            echo "변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 통계 카드와 블로그 글 목록을 갱신한다"
          git push
